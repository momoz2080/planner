    const html=`<!doctype html><html><head><meta charset="utf-8"><style>${css}</style></head><body style="margin:0;background:#fff">${paperHTML()}</body></html>`;
    return withFrame(html,1200,async doc=>{const out=[];
      for(const pg of doc.querySelectorAll(".p-page")){const port=pg.classList.contains("port");
        const r=pg.getBoundingClientRect();const img=await rasterize(pg,doc,"#fff",Math.round(r.height),2.2);
        out.push({...img,pw:port?595:842,ph:port?842:595})}
      return pagesToPdf(out)})}
  const W=1180;
  return withFrame(frameSnapshot(),W+32,async doc=>{
    const wrap=doc.querySelector(".wrap");const bg=getComputedStyle(doc.body).backgroundColor;wrap.style.maxWidth="none";wrap.style.width=W+"px";wrap.style.margin="0";wrap.style.padding="16px";wrap.style.background=bg;
    const img=await rasterize(wrap,doc,bg);return pagesToPdf([{...img,pw:842,ph:Math.round(842*img.h/img.w)}])})}
async function saveBlob(blob,name,type){const c=window.claude,touch=matchMedia("(pointer:coarse)").matches;
  if(c&&c.use){let dl=null;try{dl=await c.use("downloads")}catch(_){}
    if(dl){try{await dl.save({filename:name,data:blob});return "saved"}catch(e){if(e&&e.code==="declined")throw e}}}
  try{const file=new File([blob],name,{type});if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return "shared"}}
  catch(e){if(e&&e.name==="AbortError")return "cancelled"}
  const url=URL.createObjectURL(blob);
  if(!touch){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),4000);return "downloaded"}
  const w=window.open(url,"_blank");if(w)return "opened";
  throw Object.assign(new Error("blocked"),{code:"blocked",url})}
async function deliverPdf(blob,name){return saveBlob(blob,name,"application/pdf")}
async function snapshotFallback(){const c=window.claude;let dl=null;try{dl=await c.use("downloads")}catch(e){}
  if(!dl){toast("PDF export isn't available in this view");return}
  try{await dl.save({filename:"planner-"+viewName()+".html",data:snapshotHTML()});toast("Saved a printable copy. Open it and choose Save as PDF.")}catch(e){}}
let pdfBusy=false;
function wkLabel(m){const e=addDays(m,6);return `W${isoWeek(m)} · ${MON[m.getMonth()]} ${m.getDate()} – ${m.getMonth()===e.getMonth()?"":MON[e.getMonth()]+" "}${e.getDate()}`}
function printPanelHTML(){const v=S.view,pl=S.pm==="plan",f=S.focus,o=S.printOpt||{};
  const seg=(name,opts,cur)=>`<div class="pseg2" role="radiogroup">${opts.map(([val,lab])=>`<button type="button" role="radio" data-po="${name}" data-v="${val}" aria-checked="${String(cur)===String(val)}">${lab}</button>`).join("")}</div>`;
  let range="";
  if(v==="day"){range=`<div class="pf"><span class="pl">Pages</span>${seg("day",[["hours2","Calendar · 2 days"],["hours7","Calendar · 7 days"],["week","To-do cards · week"]],o.day||dayPrintDefault())}</div>
      <p class="ph">${(o.day||dayPrintDefault()).startsWith("hours")?"Day calendar as on screen, with blank to-do lines at the bottom. A5 pages, 2 per A4 sheet.":pl?"Cards start tomorrow. Each is a to-do list for its date.":"Cards start on the day you're viewing. Only open tasks are printed."}</p>`}
  else if(v==="week"){const base=mondayOf(new Date());const cur=o.week||iso(mondayOf(f));
    const opts=[];for(let i=-4;i<=12;i++){const m=addDays(base,7*i);opts.push(`<option value="${iso(m)}" ${iso(m)===cur?"selected":""}>${i===0?"This week · ":i===1?"Next week · ":""}${wkLabel(m)}</option>`)}
    range=`<div class="pf"><label class="pl" for="poWeek">Starting</label><select id="poWeek" data-po-sel="week">${opts.join("")}</select></div>
      <div class="pf"><span class="pl">Weeks</span>${seg("count",[[1,"1"],[2,"2"],[3,"3"],[4,"4"]],o.count||1)}</div><p class="ph">One landscape page per week.</p>`}
  else if(v==="month"){const y=o.year??f.getFullYear(),m=o.month??f.getMonth(),Y0=new Date().getFullYear();
    range=`<div class="pf"><label class="pl" for="poMonth">Month</label><div class="prow"><select id="poMonth" data-po-sel="month">${MONTH.map((n,i)=>`<option value="${i}" ${i===m?"selected":""}>${n}</option>`).join("")}</select><select id="poYear" data-po-sel="year" aria-label="Year">${[Y0-1,Y0,Y0+1,Y0+2].map(Y=>`<option ${Y===y?"selected":""}>${Y}</option>`).join("")}</select></div></div>
      <div class="pf"><span class="pl">Months</span>${seg("count",[[1,"1"],[2,"2"],[3,"3"]],o.count||1)}</div><p class="ph">${curSub()==="board"?"Month planning sheet":"Month calendar with every event and to-do"}, one landscape page per month.</p>`}
  else if(v==="year"){const Y0=new Date().getFullYear(),y=o.year??f.getFullYear();
    range=`<div class="pf"><label class="pl" for="poYear">Year</label><select id="poYear" data-po-sel="year">${[Y0-1,Y0,Y0+1,Y0+2].map(Y=>`<option ${Y===y?"selected":""}>${Y}</option>`).join("")}</select></div><p class="ph">${curSub()==="road"?"Year roadmap":"Year at a glance"}, 1 page.</p>`}
  const canPaper=v!=="insights",out=canPaper?(o.out||"paper"):"screen";
  return `${billPanel()}<div class="pp-h"><b>Print / PDF</b><button class="x" data-action="pdfmenu" aria-label="Close">✕</button></div>
    ${out==="paper"?range:`<p class="ph">Saves exactly what's on screen now.</p>`}
    <button class="ib pgo" data-action="pdfgo">Create PDF</button>`}
function dayPrintDefault(){return "hours2"}
function defPm(){const f=S.focus,v=S.view,sb=curSub();if(sb==="board"||sb==="road")return "plan";
  const start=v==="day"?iso(addDays(f,1)):v==="week"?iso(mondayOf(f)):v==="month"?iso(new Date(f.getFullYear(),f.getMonth(),1)):"9999";return start>TODAY?"plan":"review"}
function togglePdfMenu(open){if(open!==false)S.billFor=null;const m=$("#pdfMenu"),b=document.querySelector('[data-action="pdfmenu"]');if(!m)return;
  const show=open===undefined?m.hidden:open;m.hidden=!show;if(b)b.setAttribute("aria-expanded",show);
  if(show){const key=S.view+iso(S.focus)+curSub();if(S.printView!==key){S.pm=defPm();S.printOpt=S.view==="day"?{day:dayPrintDefault()}:{};S.printView=key}m.innerHTML=printPanelHTML()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-po]");if(!b)return;S.printOpt=S.printOpt||{};
  const k=b.dataset.po,v=b.dataset.v;if(k==="pm"){S.pm=v;if(S.view==="day")S.printOpt.day=dayPrintDefault()}S.printOpt[k]=k==="count"?+v:v;$("#pdfMenu").innerHTML=printPanelHTML()});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset.poSel)return;S.printOpt=S.printOpt||{};const k=el.dataset.poSel;
  S.printOpt[k]=k==="week"?el.value:+el.value});
function printPaper(){const box=$("#paper");box.innerHTML=paperHTML();document.documentElement.classList.add("paper-print");
  const done=()=>{document.documentElement.classList.remove("paper-print");box.innerHTML="";removeEventListener("afterprint",done)};addEventListener("afterprint",done);
  setTimeout(()=>{try{window.print()}catch(e){}setTimeout(()=>{if(!matchMedia("print").matches)done()},1500)},50)}
function closeReady(){const r=$("#pdfReady");if(r){if(r._url)setTimeout(()=>URL.revokeObjectURL(r._url),60000);r.remove()}}
function showReady(blob,name,pages,paper){closeReady();const c=window.claude,inClaude=!!(c&&c.use),touch=matchMedia("(pointer:coarse)").matches;
  const url=URL.createObjectURL(blob);const box=document.createElement("div");box.id="pdfReady";box.className="busy ready";box._url=url;
  box.innerHTML=`<div role="dialog" aria-label="PDF ready"><b class="rt">Your PDF is ready</b><span class="rs">${esc(name)} · ${pages} page${pages>1?"s":""} · ${Math.max(1,Math.round(blob.size/1024))} KB</span>
    <div class="rb"><button class="ib primary" data-rd="save">${touch&&!inClaude?"Save or share":"Download PDF"}</button>
    <a class="ib" href="${url}" target="_blank" rel="noopener" download="${esc(name)}">Open PDF</a>
    ${paper?`<button class="ib" data-rd="print">${touch?"Print / Save as PDF":"Print instead"}</button>`:""}
    <button class="ib" data-rd="close">Close</button></div>
    <span class="rn">${touch?"On a phone: if nothing happens, tap “Open PDF” and use Share → Save to Files, or “Print / Save as PDF”.":inClaude?"You'll be asked to confirm the download.":"If the download doesn't start, use “Open PDF”, then save from there."}</span></div>`;
  document.body.appendChild(box);box._blob=blob;box._name=name;box.querySelector('[data-rd="save"]').focus()}
document.addEventListener("click",e=>{const r=$("#pdfReady");if(r&&e.target===r)closeReady()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeReady()});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-rd]");if(!b)return;const r=$("#pdfReady");if(!r)return;const k=b.dataset.rd;
  if(k==="close"){return closeReady()}
  if(k==="print"){closeReady();return printPaper()}
  if(k==="save"){try{const how=await deliverPdf(r._blob,r._name);if(how==="cancelled")return;closeReady();toast(how==="opened"?"PDF opened. Use Share → Save to Files.":"PDF saved")}catch(err){if(err&&err.code==="declined")return;toast(err&&err.code==="rate_limited"?"A save is already open. Try again in a moment.":"This view blocks downloads. Tap “Open PDF” or “Print / Save as PDF”.")}}});
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))])}
function pdfName(paper){if(S.billFor)return `Combridgers-bill-${MONTH[S.billFor[1]]}-${S.billFor[0]}.pdf`;const o=S.printOpt||{},v=S.view;let r=viewName();
  if(paper&&v==="week"){const m=parse(o.week||iso(mondayOf(S.focus)));r=`w${isoWeek(m)}`+((o.count||1)>1?`-w${isoWeek(addDays(m,7*((o.count||1)-1)))}`:"")}
  if(paper&&v==="month"){const y=o.year??S.focus.getFullYear(),mm=o.month??S.focus.getMonth();r=`${MONTH[mm%12].toLowerCase()}-${y}`+((o.count||1)>1?`-plus-${(o.count||1)-1}`:"")}
  if(paper&&v==="year")r=String(o.year??S.focus.getFullYear());
  if(paper&&v==="day")r=((o.day==="week")?"week-":"")+r;
  return "planner-"+(paper?(S.pm==="plan"?"plan-":"paper-"):"")+r+".pdf"}
async function exportPDF(){
  const tip=$("#tip");if(tip)tip.hidden=true;if(pdfBusy)return;
  const o=S.printOpt||{},paper=!!S.billFor||S.view!=="insights"&&(o.out||"paper")==="paper";togglePdfMenu(false);
  pdfBusy=true;const ov=document.createElement("div");ov.className="busy";ov.innerHTML=`<div>Making your PDF… <button class="ib" data-cancel>Cancel</button></div>`;document.body.appendChild(ov);
  let cancelled=false;ov.querySelector("[data-cancel]").onclick=()=>{cancelled=true;ov.remove();pdfBusy=false};
  const name=pdfName(paper);let blob=null,pages=1;
  try{blob=await withTimeout(buildPdfBlob(paper?"paper":"screen"),30000);if(paper){pages=(paperHTML().match(/class="p-page/g)||[]).length||1}}catch(e){console.warn(e)}
  ov.remove();pdfBusy=false;if(cancelled)return;
  if(!blob){const c=window.claude;if(c&&c.use){toast("Couldn't build the PDF here. Saving a printable copy instead.");return snapshotFallback()}
    if(paper){toast("Couldn't build the PDF here. Opening the print window instead.");return printPaper()}
    toast("Couldn't build the PDF here.");return}
  showReady(blob,name,pages,paper)}

document.addEventListener("click",e=>{const m=$("#pdfMenu");if(m&&!m.hidden&&e.target.isConnected&&!e.target.closest(".pdfwrap"))togglePdfMenu(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")togglePdfMenu(false)});

/* ---------- actions ---------- */
function findTask(el){const row=el.closest("[data-id]");const dk=row.dataset.dk;if(row.dataset.id.startsWith("r:"))materialize(dk,row.dataset.id);const d=day(parse(dk));return{d,dk,t:d.tasks.find(t=>t.id===row.dataset.id)}}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}
const CMODES=[["auto","green","Auto"],["light","green","Light · Green"],["light","orange","Light · Orange"],["dark","green","Dark · Green"],["dark","orange","Dark · Orange"],["night","green","Night"]];
function cmIndex(s){const l=s.look||"auto",a=s.accent||"green";const i=CMODES.findIndex(([L,A])=>L===l&&(l==="night"||l==="auto"||A===a));return i<0?0:i}
function applySettings(){const s=S.docs.settings||{};document.documentElement.dataset.accent=s.accent||"green";
  const n=$("#tmName");if(document.activeElement!==n)n.value=s.tm||"";
  S.look=s.look||"auto";applyLook();
  const c=CMODES[cmIndex(s)],lb=$("#cmLbl");if(lb)lb.textContent=c[2];
  const cb=$("#cmode");if(cb){cb.dataset.look=S.look;cb.setAttribute("aria-label","Colors: "+c[2]+". Click to change.")}}
function applyLook(){const r=document.documentElement;let m=S.look||"auto";
  if(m==="auto"){const host=r.getAttribute("data-theme");m=host==="dark"||host==="light"?host:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
  r.setAttribute("data-mode",m)}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyLook)}catch(e){}
try{new MutationObserver(applyLook).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,v=b.dataset.v;
  if(a==="view"){S.view=v;return render()}
  if(a==="export"){return exportData()}
  if(a==="pdfmenu"){return togglePdfMenu()}
  if(a==="pdfgo"){return exportPDF()}
  if(a==="today"){S.focus=new Date();return render()}
  if(a==="step"){const n=+v,f=S.focus,pv=S.view==="insights"?S.per:S.view;S.focus=pv==="day"?addDays(f,n):pv==="week"?addDays(f,7*n):pv==="month"?new Date(f.getFullYear(),f.getMonth()+n,1):new Date(f.getFullYear()+n,f.getMonth(),1);return render()}
  if(a==="goDay"){S.focus=parse(v);S.view="day";window.scrollTo({top:0});return render()}
  if(a==="goMonth"){S.focus=new Date(S.focus.getFullYear(),+v,1);S.view="month";return render()}
  if(a==="clearSample"){dropSample();return render()}
  if(a==="cmode"){const st=settings(),nx=CMODES[(cmIndex(st)+1)%CMODES.length];st.look=nx[0];st.accent=nx[1];persist("settings");applySettings();toast("Colors: "+nx[2]);return}
  if(a==="per"){S.per=v;return render()}
  if(a==="coach"){return coach(b)}
  if(S.sample){dropSample();return render()}
  if(a==="energy"||a==="mood"){const x=day(S.focus);x[a]=x[a]===+v?0:+v;persist(dayKey(S.focus));return render()}
  const {d,dk,t}=findTask(b);if(!t)return;
  if(a==="cycle"){t.status=t.status==="carry"?"open":STORD[(STORD.indexOf(t.status)+1)%STORD.length]}
  else if(a==="quad"){t.q=QORD[(QORD.indexOf(t.q||"plan")+1)%4]}
  else if(a==="impact"){t.impact=t.impact===+v?0:+v}
  else if(a==="del"){d.tasks.splice(d.tasks.indexOf(t),1)}
  else if(a==="carry"){const nx=addDays(parse(dk),1),y=day(nx);
    if(t.status==="carry"){t.status="open";const i=y.tasks.findIndex(x=>x.from===t.id);if(i>-1)y.tasks.splice(i,1)}
    else{t.status="carry";y.tasks.push({id:uid(),t:t.t,q:t.q,est:t.est||30,mins:0,status:"open",impact:0,one:false,from:t.id});toast("Moved to "+DOW[(nx.getDay()+6)%7]+" "+nx.getDate())}
    persist(dayKey(nx))}
  persist("d"+dk);render();
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-add]");if(!f)return;e.preventDefault();
  if(S.sample)dropSample();
  const inp=f.querySelector("input");const txt=inp.value.trim();if(!txt)return;
  const dk=f.dataset.add,st=f.dataset.status;const id=inp.id;inp.value="";
  day(parse(dk)).tasks.push({id:uid(),t:txt,q:"plan",est:st==="open"?30:0,mins:0,status:st,impact:0,one:false});
  persist("d"+dk);render();const again=document.getElementById(id);if(again)again.focus();
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="tmName"){settings().tm=el.value;persist("settings");return}
  if(el.dataset.field){const {dk,t}=findTask(el);if(!t)return;const f=el.dataset.field;t[f]=f==="t"?el.value:Math.max(0,parseInt(el.value,10)||0);persist("d"+dk);return}
  if(el.dataset.dayfield){day(parse(el.dataset.dk))[el.dataset.dayfield]=el.value;persist("d"+el.dataset.dk);return}
  if(el.dataset.actionInput==="oneTomorrow"){const dk=el.dataset.dk,y=day(parse(dk));let t=y.tasks.find(x=>x.one);
    if(!t){t={id:uid(),t:"",q:"do",est:60,mins:0,status:"open",impact:0,one:true};y.tasks.unshift(t)}t.t=el.value;
    if(!el.value.trim())y.tasks.splice(y.tasks.indexOf(t),1);persist("d"+dk);return}
  if(el.dataset.doc){const k=el.dataset.doc;const doc=S.docs[k];if(!doc)return;
    if(el.dataset.docfield){doc[el.dataset.docfield]=el.value}
    else if(el.dataset.list){const it=doc[el.dataset.list][+el.dataset.i];const kk=el.dataset.k;
      it[kk]=el.type==="checkbox"?el.checked:el.type==="range"?+el.value:el.value;
      if(el.type==="range"){const p=document.getElementById("rkp"+el.dataset.i);if(p)p.textContent=el.value+"%"}}
    persist(k)}
});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.field&&el.dataset.field!=="t")render()});
document.addEventListener("focusin",e=>{const el=e.target;
  if(!S.sample||el.id==="tmName"||!el.matches("input,textarea")||el.closest("form")||el.id==="dump")return;
  const id=el.id;dropSample();render();const again=id&&document.getElementById(id);if(again)again.focus();});

boot();
})();
</script>

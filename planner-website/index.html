<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#2f5d50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Light (default) */
:root{
  --acc:#0F9E8A; --acc-strong:#0B6F61; --acc-soft:#DDF4EF; --acc-ink:#fff;
  --alt:#E8900C; --alt-soft:#FFF1D9;
  --bg:#F6F8F7; --surface:#FFFFFF; --surface-2:#EFF3F2; --line:#DCE3E1; --line-2:#C7D1CE;
  --ink:#17221F; --ink-2:#4C5B57; --ink-3:#77847F;
  --good:#1F8A4C; --warn:#C7741F; --bad:#D03B3B;
  --q-do:#0F9E8A; --q-plan:#2a78d6; --q-del:#eb6834; --q-drop:#8a7fd6;
  --grid:#E3E8E6;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 4px 14px rgba(20,40,35,.05);
  --r:12px;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
/* Eye-comfort dark: soft charcoal (never pure black),off-white text (~12:1,not 21:1),desaturated accents */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode]){color-scheme:dark;
    --acc:#4DB3A2;--acc-strong:#8FD6C9;--acc-soft:#1F3632;--acc-ink:#0E1A18;--alt:#D9A35F;--alt-soft:#352A1C;
    --bg:#161A19;--surface:#1D2221;--surface-2:#242A28;--line:#2F3734;--line-2:#3D4743;
    --ink:#DCE2DF;--ink-2:#A4AFAB;--ink-3:#7C8884;--good:#5DBB82;--warn:#DDA15A;--bad:#E27A7A;
    --q-do:#1FA893;--q-plan:#3987e5;--q-del:#d95926;--q-drop:#9085e9;--grid:#2A312F;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);}
}
:root[data-theme="dark"]:not([data-mode]),:root[data-mode="dark"]{color-scheme:dark;
  --acc:#4DB3A2;--acc-strong:#8FD6C9;--acc-soft:#1F3632;--acc-ink:#0E1A18;--alt:#D9A35F;--alt-soft:#352A1C;
  --bg:#161A19;--surface:#1D2221;--surface-2:#242A28;--line:#2F3734;--line-2:#3D4743;
  --ink:#DCE2DF;--ink-2:#A4AFAB;--ink-3:#7C8884;--good:#5DBB82;--warn:#DDA15A;--bad:#E27A7A;
  --q-do:#1FA893;--q-plan:#3987e5;--q-del:#d95926;--q-drop:#9085e9;--grid:#2A312F;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);}
:root[data-mode="light"]{color-scheme:light}
/* Orange accent */
:root[data-accent="orange"]{--acc:#DE860B;--acc-strong:#8F5200;--acc-soft:#FFF0D6;--alt:#0F9E8A;--alt-soft:#DDF4EF}
:root[data-mode="dark"][data-accent="orange"]{--acc:#D9A35F;--acc-strong:#F0C893;--acc-soft:#352A1C;--acc-ink:#1E1409;--alt:#4DB3A2;--alt-soft:#1F3632}
/* Night: warm,low-blue dark for evenings (amber accent,cream text) */
:root[data-mode="night"][data-mode]{color-scheme:dark;
  --acc:#D19A55;--acc-strong:#EBC592;--acc-soft:#33281B;--acc-ink:#1B130A;--alt:#9DB88E;--alt-soft:#262B1F;
  --bg:#1A1714;--surface:#211D19;--surface-2:#28231E;--line:#352E27;--line-2:#443B32;
  --ink:#E4D8C5;--ink-2:#B3A690;--ink-3:#877B69;--good:#9DB88E;--warn:#D9A35F;--bad:#D98A7A;
  --q-do:#1FA893;--q-plan:#3987e5;--q-del:#d95926;--q-drop:#9085e9;--grid:#2C2621;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:26px;height:26px;color:var(--acc)}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.who input{border:0;background:transparent;width:150px;padding:4px 2px;font-weight:600}
.who input:focus{outline:none}
.sw{display:flex;gap:4px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.save{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.save[data-s="saving"] i{background:var(--warn)} .save[data-s="error"] i{background:var(--bad)} .save[data-s="local"] i{background:var(--ink-3)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink)}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav .lbl{font-family:var(--display);font-weight:600;font-size:17px;min-width:12ch;text-align:center}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 10px;font-weight:600;color:var(--ink-2)}
.ib:hover{border-color:var(--line-2);color:var(--ink)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--alt-soft);border:1px dashed var(--alt);border-radius:var(--r);padding:10px 14px;margin-block:6px 12px;font-size:13px}
.banner b{font-weight:700}
.banner .ib{margin-left:auto}


.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:900px){.grid-side{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.ch h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.ch .sub{color:var(--ink-3);font-size:12px}
.ch .right{margin-left:auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.stat .v small{font-size:13px;font-weight:600;color:var(--ink-3)}
.stat .k{font-size:12px;color:var(--ink-3)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:3px}

/* ONE thing */
.one{display:flex;align-items:center;gap:10px;background:var(--acc-soft);border-radius:10px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.one .n{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;flex:none}
.one input{flex:1;min-width:0;border:0;background:transparent;font-weight:600;font-size:15px;padding:6px 2px}
.one input:focus{outline:none}
.one input::placeholder{color:color-mix(in srgb,var(--acc-strong) 55%,transparent)}

/* tasks */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{border:0;background:transparent;padding:5px 2px;min-width:0;width:100%}
.task .t:focus{outline:none;background:var(--surface-2);border-radius:6px}
.task[data-st="done"] .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.st{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-3)}
.st[data-st="done"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.st[data-st="partial"]{background:var(--alt-soft);border-color:var(--alt);color:var(--alt)}
.st[data-st="carry"]{border-style:dashed;color:var(--ink-2)}
.q{border:1px solid var(--line-2);background:transparent;border-radius:6px;font-size:11px;font-weight:700;padding:3px 6px;min-width:58px;color:var(--ink-2)}
.q[data-q="do"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.q[data-q="plan"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-strong)}
.q[data-q="drop"]{text-decoration:line-through;color:var(--ink-3)}
.mins{display:flex;align-items:center;gap:2px;color:var(--ink-3);font-size:12px}
.mins input{width:44px;border:1px solid transparent;background:var(--surface-2);border-radius:6px;padding:4px 4px;text-align:right;font-family:var(--mono);font-size:12px}
.mins input:focus{outline:none;border-color:var(--acc)}
.imp{display:flex;gap:2px}
.imp button{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;padding:0}
.imp button[aria-pressed="true"]{background:var(--acc)}
.acts{display:flex;gap:2px}
.x{border:0;background:transparent;color:var(--ink-3);width:26px;height:26px;border-radius:6px;font-size:14px}
.x:hover{background:var(--surface-2);color:var(--ink)}
.x[aria-pressed="true"]{color:var(--alt)}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;border:1px dashed var(--line-2);background:transparent;border-radius:8px;padding:8px 10px}
.add input:focus{outline:none;border-style:solid;border-color:var(--acc)}
.add button{border:0;background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:0 14px;font-weight:700}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);margin-top:8px}
@media (max-width:560px){
  .task{grid-template-columns:auto minmax(0,1fr) auto;row-gap:2px}
  .task .q{grid-column:1}.task .mins,.task .imp,.task .acts{grid-row:2}
  .task .mins{grid-column:2;justify-self:start}
}

/* pulse */
.pulse{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:14px 20px;align-items:start}
@media (max-width:640px){.pulse{grid-template-columns:1fr 1fr}.pulse .span{grid-column:1/-1}}
.seg{display:flex;gap:4px;margin-top:6px}
.seg button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;resize:vertical;min-width:0}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--acc);background:var(--surface)}

.cap{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.cap .cells{display:flex;gap:3px}
.cap .cells i{width:16px;height:10px;border-radius:3px;border:1px solid var(--acc);display:block}
.cap .cells i.on{background:var(--acc)}
.cap .cells i.over{border-color:var(--bad);border-style:dashed}
.cap .cells i.over.on{background:var(--bad)}
.cap b{font-family:var(--mono)}
.cap.over{color:var(--bad)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1000px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.week{grid-template-columns:1fr}}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wd.we{background:var(--surface-2)}
.wd.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.wd .h{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--acc);padding-bottom:6px}
.wd .h b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.wd .h .d{font-family:var(--display);font-weight:800;font-size:22px;margin-left:auto;line-height:1}
.wd .h button{border:0;background:transparent;padding:0;color:inherit;text-align:left;display:flex;align-items:baseline;gap:6px;width:100%}
.wd .o{font-size:12px;font-weight:600;background:var(--acc-soft);color:var(--acc-strong);border-radius:6px;padding:4px 6px}
.wt{display:flex;align-items:flex-start;gap:6px;font-size:12.5px}
.wt .st{width:18px;height:18px;border-radius:5px;font-size:10px;flex:none;margin-top:1px}
.wt span{min-width:0;overflow-wrap:anywhere}
.wt[data-st="done"] span{color:var(--ink-3);text-decoration:line-through}
.wd .add{margin-top:auto}
.wd .add input{padding:5px 8px;font-size:12px}
.wd .add button{padding:0 9px}
.wd .f{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:6px}


.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.list li{font-size:13px;display:flex;gap:8px}
.list li .dt{color:var(--ink-3);font-family:var(--mono);font-size:11px;flex:none;width:44px;padding-top:2px}


















/* year */
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--surface-2);display:block}
.heat i.l1{background:color-mix(in srgb,var(--acc) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--acc) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--acc) 80%,var(--surface-2))}
.heat i.l4{background:var(--acc-strong)}
.heat i.pad{background:transparent}
.heat i.now{outline:2px solid var(--alt);outline-offset:1px}
.hm{display:grid;grid-auto-flow:column;gap:3px;font-size:10px;color:var(--ink-3);margin-bottom:4px}
.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:800px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mo{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mo:hover{border-color:var(--acc)}
.mo.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.mo .nm{font-family:var(--display);font-weight:600;font-size:16px}
.mo .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.mo .row b{color:var(--ink);font-family:var(--mono);font-weight:500}
.rock{display:grid;grid-template-columns:auto minmax(0,1fr) 56px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rock:last-child{border-bottom:0}
.rock .n{width:26px;height:26px;border-radius:7px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800}
.rock input[type=text]{border:0;background:transparent;font-weight:600;min-width:0;width:100%;padding:4px 0}
.rock input[type=text]:focus{outline:none;border-bottom:1px solid var(--acc)}
.rock input[type=range]{grid-column:2;accent-color:var(--acc);width:100%}
.rock .pct{grid-column:3;grid-row:1/3;font-family:var(--mono);text-align:right;font-weight:700;color:var(--acc-strong)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:20}
@media (prefers-reduced-motion:no-preference){.card,.wd{transition:border-color .15s}}

/* look switch */
.look{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.look button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-3)}
.look button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
/* insights */
.pseg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;max-width:100%;margin-bottom:14px}
.pseg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;color:var(--ink-2)}
.pseg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.stats.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.igrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.igrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.igrid,.igrid.three{grid-template-columns:1fr}}
.chart{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);height:190px;margin-top:6px}
.yax{position:relative;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.yax span{position:absolute;right:6px;transform:translateY(50%)}
.plot{position:relative;border-bottom:1px solid var(--line-2)}
.plot .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.plot .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-3);z-index:2;pointer-events:none}
.plot .avg em{position:absolute;right:0;top:-16px;font-style:normal;font-size:10.5px;color:var(--ink-2);background:var(--surface);padding:0 4px}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px;z-index:1}
.bars .b{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0;cursor:default}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:4px 4px 0 0;min-height:0}
.bars .b.zero i{background:transparent}
.bars .b:hover i,.bars .b:focus i{filter:brightness(1.12)}
.bars .b.cur i{background:var(--acc-strong)}
.xax{grid-column:2;display:flex;gap:2px;font-size:10.5px;color:var(--ink-3);margin-top:4px}
.xax span{flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.qbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2);margin:8px 0 12px}
.qbar i{display:block;height:100%}
.qrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.qrow:last-child{border-bottom:0}
.qrow .sw{width:12px;height:12px;border-radius:3px}

.bl-logo{width:15mm;height:15mm;border-radius:3mm;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21pt;font-weight:800}
.bl-brand b{display:block;font-size:17pt;letter-spacing:.06em}.bl-brand span{display:block;color:#5B6B67;font-size:8.6pt;margin-top:1mm;line-height:1.4}
.bl-title{text-align:right}.bl-title h1{margin:0;font-size:24pt;font-weight:800;color:var(--deep);letter-spacing:.01em}.bl-month{font-size:13pt;font-weight:700;margin-top:1.5mm}
.bl-info{display:flex;gap:9mm;justify-content:space-between}
.bl-info i{display:block;font-style:normal;font-size:7.2pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#86938F;margin-bottom:.8mm}
.bl-info b{font-size:10pt;line-height:1.35}.bl-to{max-width:80mm;text-align:right;padding-left:6mm}
.bl-t{width:100%;border-collapse:collapse;font-size:9pt}
.bl-t th{background:var(--deep);color:#fff;font-weight:700;text-align:left;padding:2.6mm 2.4mm;font-size:8pt;white-space:nowrap}
.bl-t th:nth-child(n+8),.bl-t td:nth-child(n+8){text-align:right}
.bl-t td{padding:2.4mm 2.4mm;border-bottom:.25mm solid #E3E9E7;white-space:nowrap}
.bl-t tbody tr:nth-child(even) td{background:#F6F9F8}
.bl-t tr.missed td{color:#9AA5A2}
.bl-t tfoot td:not(:first-child){text-align:right}.bl-t tfoot td{font-weight:800;border-top:.5mm solid var(--deep);border-bottom:0;padding-top:2.2mm;background:var(--tint)}
.bst{display:inline-block;border-radius:1.2mm;padding:.5mm 2mm;font-size:7.8pt;font-weight:700;background:#E7F4EF;color:#0B6B5E}
.bst-noshow{background:#FFF1D9;color:#8A5300}.bst-resched{background:#E8EEFB;color:#2F4F9A}.bst-missed{background:#EEF0EF;color:#7A8582}
.bl-empty{text-align:center!important;color:#86938F;padding:8mm!important}
.bl-foot{display:flex;gap:10mm;align-items:flex-start}
.bl-notes{flex:1;color:#5B6B67;font-size:8.4pt;line-height:1.7}.bl-notes b{color:#17221F}
.bl-due{width:80mm;border:.3mm solid var(--soft);border-radius:2.5mm;overflow:hidden}
.bl-due div{display:flex;justify-content:space-between;padding:2.8mm 4mm;font-size:10pt;border-bottom:.25mm solid #E3E9E7}
.bl-due .tot{background:var(--deep);color:#fff;font-size:13pt;font-weight:800;border:0}
.bl-pg{margin-top:auto;text-align:center;color:#9AA5A2;font-size:7.5pt;padding-top:4mm}

.pp{font-family:"Figtree",Carlito,"Helvetica Neue",Arial,sans-serif;color:#1c1f2a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pp *{box-sizing:border-box;margin:0;padding:0}
.p-page{position:relative;overflow:hidden;background:#fff;page-break-after:always;break-after:page}
.p-page:last-child{page-break-after:auto;break-after:auto}
.p-page.land{width:297mm;height:210mm;padding:9mm 10mm 7mm;display:flex;flex-direction:column}
.p-page.port{width:210mm;height:297mm;display:grid;grid-template-columns:105mm 105mm;grid-template-rows:148.5mm 148.5mm}
.pp .fill{color:var(--deep);font-weight:600}
.pp .ln{display:block;border-bottom:.2mm solid #cfd2d9;min-height:5mm;flex:1;font-size:7pt;padding:0 .5mm .3mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:flex-end}
.pp .cutv{position:absolute;left:105mm;top:0;bottom:0;border-left:.25mm dashed #c3c6cf}
.pp .cuth{position:absolute;top:148.5mm;left:0;right:0;border-top:.25mm dashed #c3c6cf}
/* ---- day card ---- */
.dc{position:relative;padding:5.5mm 6.5mm 4.5mm;display:flex;flex-direction:column;font-size:6.4pt;overflow:hidden}
.dc .band{background:var(--acc);color:#fff;border-radius:2.5mm;padding:2.4mm 3mm 2.2mm}
.dc .ptop{display:flex;justify-content:space-between;align-items:center}
.dc .pbrand{font-weight:800;letter-spacing:.16em;font-size:8.4pt}
.dc .pdays{display:flex;gap:.9mm}
.dc .pdays span{width:3.5mm;height:3.5mm;border-radius:50%;border:.25mm solid #fff;display:flex;align-items:center;justify-content:center;font-size:4.8pt;font-weight:700}
.dc .pdays span.on{background:#fff;color:var(--deep)}
.dc .f{display:flex;align-items:flex-end;gap:1.5mm;margin-top:1.7mm;flex:1}
.dc .f label{font-size:5pt;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.dc .f span{flex:1;border-bottom:.25mm solid #fff;height:4mm;font-size:7pt;font-weight:600;padding:0 .5mm .3mm;display:flex;align-items:flex-end;white-space:nowrap;overflow:hidden}
.dc .ff{display:flex;gap:4mm}
.dc .lbl{font-size:5pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--deep);display:flex;justify-content:space-between;margin-top:2.2mm}
.dc .lbl small{letter-spacing:0;text-transform:none;font-weight:500;color:#7c818d;font-size:4.6pt}
.dc .hrs{display:grid;grid-template-columns:repeat(15,1fr);gap:.5mm;margin-top:.8mm}
.dc .hrs span{height:3.4mm;border:.2mm solid var(--soft);border-radius:.6mm;font-size:3.6pt;color:#9aa0ab;padding:.2mm .4mm}
.dc h2{display:flex;align-items:center;gap:1.4mm;margin-top:2.5mm;font-size:8.2pt;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.dc h2 .tag{background:var(--deep);color:#fff;font-size:5.2pt;padding:.5mm 1mm;border-radius:.8mm}
.dc h2 em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--acc)}
.dc h2 small{margin-left:auto;font-size:4.5pt;font-weight:500;color:#7c818d;text-transform:none;letter-spacing:0}
.dc .row{display:flex;align-items:flex-end;gap:1.5mm;height:5.3mm}
.dc .row .ck{margin-bottom:.6mm}
.dc .row .ln{height:100%}
.dc .pst{display:flex;gap:.4mm;margin-bottom:.4mm}
.dc .pst i{font-style:normal;width:3mm;height:3mm;border-radius:.7mm;display:flex;align-items:center;justify-content:center;font-size:4.6pt;border:.2mm solid var(--acc);color:var(--soft);font-weight:700}
.dc .pst i.on{background:var(--acc);color:#fff}
.dc .tm{width:9.5mm;border-bottom:.2mm solid #cfd2d9;font-size:5pt;text-align:right;white-space:nowrap;padding:0 .5mm .3mm 0;flex:none;color:var(--deep);font-weight:600}
.dc .pimp{display:flex;gap:.5mm;margin-bottom:.9mm}
.dc .pimp b{width:1.9mm;height:1.9mm;border-radius:50%;border:.2mm solid var(--acc)}
.dc .pimp b.on{background:var(--acc)}
.dc .ppulse{display:flex;gap:2mm;margin-top:2mm;background:var(--tint);border-radius:1.6mm;padding:1.4mm 2mm;align-items:flex-end}
.dc .p label{display:block;font-size:4.6pt;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--deep);margin-bottom:.8mm}
.dc .batt{display:flex;align-items:center;gap:.3mm}
.dc .batt .cells{display:flex;gap:.3mm;border:.25mm solid var(--deep);border-radius:.6mm;padding:.35mm;width:13mm}
.dc .batt i{flex:1;height:2.4mm;border-radius:.2mm;background:#fff;border:.15mm solid var(--soft)}
.dc .batt i.on{background:var(--acc);border-color:var(--acc)}
.dc .batt b{width:.7mm;height:1.6mm;background:var(--deep);border-radius:0 .3mm .3mm 0}
.dc .moods{display:flex;gap:.7mm}
.dc .moods span{width:3.6mm;height:3.6mm;border-radius:50%;background:#fff;border:.2mm solid var(--soft);display:flex;align-items:center;justify-content:center;font-size:5.5pt;color:var(--deep);line-height:1}
.dc .moods span.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dc .pwin{flex:1;min-width:0}
.dc .pwin .ln{height:3.6mm;border-color:var(--soft)}
.dc .frog{display:flex;align-items:stretch;gap:1.8mm;margin-top:1.3mm;border:.35mm solid var(--acc);border-radius:1.6mm;padding:1mm 1.8mm 1.2mm 1.1mm;background:var(--tint)}
.dc .fnum{width:6mm;border-radius:1mm;background:var(--acc);color:#fff;font-weight:800;font-size:10pt;display:flex;align-items:center;justify-content:center}
.dc .fbody{flex:1;display:flex;flex-direction:column;min-width:0}
.dc .fbody small{font-size:4.8pt;font-weight:700;color:var(--deep);text-transform:uppercase;letter-spacing:.08em}
.dc .fbody .ln{height:4.2mm;border-color:var(--soft);font-size:7.2pt}
.dc .pnum{width:3mm;font-weight:700;color:var(--acc);font-size:6.2pt;text-align:center;padding-bottom:.3mm}
.pp .quad{width:4mm;height:4mm;display:grid;grid-template-columns:1fr 1fr;gap:.3mm;margin-bottom:.4mm;flex:none}
.pp .quad i{border-radius:.3mm;border:.2mm solid var(--acc)}
.pp .quad i:nth-child(3),.pp .quad i:nth-child(4){border-color:#b9bdc7}
.pp .quad i.on{background:var(--acc);border-color:var(--acc)}
.pp .quad i:nth-child(3).on,.pp .quad i:nth-child(4).on{background:#8a8f9c;border-color:#8a8f9c}
.dc .pcap{display:flex;align-items:center;gap:1.6mm;margin-top:1.8mm}
.dc .pcap label{font-size:4.6pt;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--deep)}
.dc .pbar{display:flex;gap:.4mm}
.dc .pbar i{width:3.2mm;height:2.6mm;border:.2mm solid var(--acc);border-radius:.4mm}
.dc .pbar i.on{background:var(--acc)}
.dc .pbar i.over{border-color:#C0664A;border-style:dashed}
.dc .pbar i.over.on{background:#C0664A}
.dc .pcap small{font-size:4.4pt;color:#7c818d}
.dc .foot{margin-top:auto;display:flex;flex-direction:column;padding-top:1.5mm}
.dc .foot label{font-size:4.6pt;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--deep);margin-top:1mm}
.dc .foot .ln{height:4mm;flex:none}
.dc .no{position:absolute;right:6.5mm;bottom:1.3mm;font-size:3.8pt;letter-spacing:.2em;color:#b3b7c0;font-weight:600}
/* ---- shared landscape ---- */
.lb{background:var(--acc);color:#fff;border-radius:3mm;padding:3.2mm 6mm;display:flex;justify-content:space-between;align-items:flex-end;flex:none}
.lb .pbrand{font-weight:800;letter-spacing:.18em;font-size:7pt}
.lb h1{font-size:24pt;font-weight:800;line-height:1;margin-top:1.4mm}
.lb h1 em{font-style:normal;font-weight:400;opacity:.8}
.lb .mnum{font-size:11pt;font-weight:700;background:#ffffff33;border-radius:1mm;padding:.6mm 1.4mm;margin-right:3mm;vertical-align:middle}
.lb .br{display:flex;flex-direction:column;gap:2.2mm;width:85mm}
.lb .br label{display:flex;align-items:flex-end;gap:2mm;font-size:6.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.lb .br label span{flex:1;border-bottom:.3mm solid #fff;height:5mm;font-size:9pt;letter-spacing:0;text-transform:none;padding:0 1mm .3mm;display:flex;align-items:flex-end}
.lb .qp{display:flex;align-items:center;justify-content:flex-end;gap:2mm;font-size:6pt;font-weight:600}
.lb .pqbar{display:flex;gap:.6mm}
.lb .pqbar i{width:3.4mm;height:2.4mm;border-radius:.4mm;border:.25mm solid #fff}
.lb .pqbar i.on{background:#fff}
.pp h3{font-size:6.5pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--deep)}
.pp .blk{border:.3mm solid var(--soft);border-radius:2.5mm;padding:2mm 2.8mm 2.2mm}
.pp .goal{background:var(--acc);color:#fff;border-radius:2.5mm;padding:2.3mm 3mm 2.6mm}
.pp .goal small{font-size:6pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pp .goal .ln{border-color:#ffffffb3;flex:none;font-size:8.5pt;color:#fff;min-height:5.6mm;white-space:normal}
.pp .pr{display:flex;align-items:flex-end;gap:2mm}
.pp .pr .ln{height:5.6mm;flex:1}
.pp .ck{width:3mm;height:3mm;border:.25mm solid var(--acc);border-radius:.6mm;margin-bottom:.5mm;flex:none;display:flex;align-items:center;justify-content:center;font-size:5pt;font-weight:800;color:#fff}
.pp .ck.on{background:var(--acc)}
.pp .ck.half{background:var(--soft)}
.pp .prog{display:flex;gap:.5mm;align-items:center}
.pp .prog i{width:3.6mm;height:2.4mm;border:.25mm solid var(--acc);border-radius:.4mm}
.pp .prog i.on{background:var(--acc)}
.pp .dots{display:flex;gap:.8mm}
.pp .dots i{width:3.2mm;height:3.2mm;border-radius:50%;border:.25mm solid var(--acc);font-style:normal;font-size:4.4pt;display:flex;align-items:center;justify-content:center;color:#7c818d}
.pp .dots i.on{background:var(--acc);color:#fff}
.pp .rv{display:flex;align-items:center;gap:2mm;margin-top:1.2mm}
.pp .rv label{font-size:5.8pt;font-weight:600;color:#555b68;width:11mm;flex:none}
.pp .rv.col{flex-direction:column;align-items:stretch;gap:0}
.pp .rv.col label{width:auto}
.pp .rv .ln{flex:none;height:5.2mm}
.pp footer{display:flex;justify-content:space-between;align-items:center;margin-top:2.5mm;font-size:5.8pt;color:#7c818d;flex:none}
.pp footer b{display:inline-block;font-size:5.4pt;padding:.4mm 1.4mm;border-radius:.5mm;margin-left:1mm;border:.2mm solid #b9bdc7;font-weight:700}
.pp footer .q1{background:var(--acc);color:#fff;border-color:var(--acc)}
.pp footer .q2{background:var(--tint);color:var(--deep);border-color:var(--acc)}
.pp footer .q4{text-decoration:line-through;color:#a3a8b3}
.pp footer span:last-child{letter-spacing:.2em;font-weight:600;color:#b3b7c0}
/* ---- week ---- */
.wg{flex:1;display:grid;grid-template-columns:62mm minmax(0,1fr);gap:4mm;margin-top:3.5mm;min-height:0}
.wg aside{display:flex;flex-direction:column;gap:2.4mm;min-height:0}
.wg .hab{display:flex;align-items:flex-end;gap:.5mm}
.wg .hab .ln{flex:1;height:5.2mm;margin-right:1mm}
.wg .hab i{width:3.6mm;height:3.6mm;border:.25mm solid var(--soft);border-radius:.6mm;margin-bottom:.4mm;flex:none}
.wg .hd{display:flex;justify-content:space-between;width:28.4mm;float:right}
.wg .hd b{width:3.6mm;text-align:center;font-size:5pt;color:#7c818d}
.wg .pdays{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:.4mm solid var(--deep);min-height:0}
.wg .day,.wg .half{border-left:.2mm solid #e3e5ea;padding:1.5mm 1.8mm 1.3mm;display:flex;flex-direction:column;min-height:0;min-width:0}
.wg .wkend{display:grid;grid-template-rows:1fr 1fr;background:var(--tint);min-width:0}
.wg .half+.half{border-top:.3mm solid var(--soft)}
.wg .dhd{display:flex;align-items:baseline;gap:1.2mm;padding-bottom:1.1mm;border-bottom:.3mm solid var(--acc)}
.wg .dname{font-size:6.5pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--deep)}
.wg .dnum{font-size:15pt;font-weight:800;line-height:1;margin-left:auto}
.wg .dmon{font-size:5.6pt;color:#7c818d;font-weight:600;text-transform:uppercase}
.wg .lab{font-size:4.8pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3a8b3;margin-top:1.5mm;display:flex;justify-content:space-between}
.wg .t3{display:flex;align-items:flex-end;gap:1.2mm}
.wg .t3 .ln{height:5.2mm;font-size:6.4pt}
.wg .t3.pone .ln{color:var(--deep);font-weight:700}
.wg .sched{flex:1;display:flex;flex-direction:column;margin-top:.6mm}
.wg .hr{flex:1;border-top:.2mm solid #e8e9ed;font-size:4.6pt;color:#9aa0ab;padding:.3mm 0 0}
.hev{display:block;margin-left:3mm;margin-top:-.2mm;font-size:5pt;color:#3d3a8f;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hev b,.wev b{font-weight:800}.wev{font-size:5.2pt;color:#3d3a8f;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.wg .more{font-size:5pt;color:var(--deep);margin-top:.6mm}
.wg .dfoot{display:flex;align-items:center;gap:1mm;margin-top:1.1mm;padding-top:1.1mm;border-top:.2mm solid #e3e5ea;font-size:4.8pt;color:#7c818d;font-weight:600}
.wg .dfoot .dots i{width:2.4mm;height:2.4mm}
.wg .ok{margin-left:auto;color:var(--deep)}
/* ---- month ---- */
.mg{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 62mm;gap:5mm;margin-top:4mm;min-height:0}
.mg .cal{display:grid;grid-template-columns:7mm repeat(7,minmax(0,1fr)) 26mm;border-top:.4mm solid var(--deep);min-height:0}
.mg .dh{font-size:6.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--deep);display:flex;align-items:center;padding-left:1.5mm}
.mg .dh.we{color:var(--acc)}
.mg .wn{display:flex;align-items:flex-start;justify-content:center;padding-top:1.5mm;border-top:.2mm solid #e3e5ea;font-size:5.5pt;color:#a3a8b3}
.mg .c{border-top:.2mm solid #e3e5ea;border-left:.2mm solid #e3e5ea;padding:1.2mm 1.4mm;display:flex;flex-direction:column;gap:.6mm;min-width:0;overflow:hidden}
.mg .c.we{background:var(--tint)}
.mg .c.o{background:#fafafa}
.mg .c .dn{display:flex;align-items:center;gap:1mm;font-size:10.5pt;font-weight:800;line-height:1}
.mg .c.o .dn{color:#d3d6dc;font-weight:500}
.mg .c .e{margin-left:auto;width:2mm;height:2mm;border-radius:50%}
.mg .c .ot{font-size:5.6pt;color:var(--deep);font-weight:600;line-height:1.25;overflow:hidden;max-height:7.2mm}
.cal .ot{font-size:5.3pt;white-space:nowrap;text-overflow:ellipsis;max-height:none}.cal .ot.ev{color:#3d3a8f}
.mg .c .cnt{margin-top:auto;font-size:5.2pt;color:#7c818d}
.mg .c .mt{height:1mm;background:#eef0f2;border-radius:.5mm;overflow:hidden}
.mg .c .mt i{display:block;height:100%;background:var(--acc)}
.mg .wf{border-top:.2mm solid #e3e5ea;border-left:.4mm solid var(--deep);padding:1.2mm 1.6mm;background:#fcfcfd;font-size:5.8pt;color:var(--deep);font-weight:600;overflow:hidden}
.mg .wf small{display:block;font-size:4.8pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a3a8b3;margin-bottom:.5mm}
.mg aside{display:flex;flex-direction:column;gap:2.6mm;min-height:0}
.mg .notes{flex:1;display:flex;flex-direction:column}
.mg .notes i{flex:1;border-bottom:.2mm solid #e3e5ea}
/* ---- year ---- */
.yg{flex:1;display:grid;grid-template-columns:78mm minmax(0,1fr);gap:6mm;margin-top:4mm;min-height:0}
.yg .prock{display:flex;gap:2.4mm;align-items:center;margin-top:1.8mm;padding:1.8mm 2.4mm;background:var(--tint);border-radius:2mm}
.yg .rn{width:6.5mm;height:6.5mm;border-radius:1.4mm;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10pt;flex:none}
.yg .rb{flex:1;display:flex;flex-direction:column;gap:1.2mm;min-width:0}
.yg .rb .ln{border-color:var(--soft);font-size:7.5pt;min-height:4.8mm}
.yg .rb small{font-size:5pt;color:#7c818d;margin-left:1mm}
.yg .pmonths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3mm}
.yg .mini{border:.3mm solid var(--soft);border-radius:2mm;padding:1.8mm 2mm 1.6mm;min-width:0}
.yg .mini .mt{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:8pt;color:var(--deep)}
.yg .mini .mt small{font-size:5pt;font-weight:600;color:#7c818d}
.yg .mini .pone{font-size:5.2pt;color:var(--deep);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:2.6mm;margin:.4mm 0 .6mm}
.yg .mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:.4mm;text-align:center;font-size:4.8pt}
.yg .mini .g b{font-size:4.2pt;color:#a3a8b3;font-weight:600}
.yg .mini .g span{height:3.4mm;display:flex;align-items:center;justify-content:center;border-radius:.6mm;color:#555b68}
.yg .mini .g span.o{color:transparent}
.yg .mini .g span.l1{background:var(--tint)}
.yg .mini .g span.l2{background:var(--soft)}
.yg .mini .g span.l3{background:var(--acc);color:#fff}
.yg .mini .g span.l4{background:var(--deep);color:#fff}
.yg .mini .g span.we{font-weight:700;color:var(--acc)}

<script>
(function(){
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtH=m=>{m=Math.round(m||0);if(!m)return"0h";const h=Math.floor(m/60),r=m%60;return h?(r?`${h}h ${r}m`:`${h}h`):`${r}m`};
const Q={do:"Do",plan:"Plan",delegate:"Delegate",drop:"Drop"};
const QORD=["do","plan","delegate","drop"];
const STORD=["open","done","partial"];
const STICON={open:"",done:"✓",partial:"½",carry:"↻"};

/* ---------- state ---------- */
const S={docs:{},view:"day",per:"week",pm:"review",focus:new Date(),sample:false,mode:"local"};
const TODAY=iso(new Date());
const dayKey=d=>"d"+(typeof d==="string"?d:iso(d));
const weekKey=d=>"w"+iso(mondayOf(d));
const monthKey=d=>`m${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const yearKey=d=>"y"+d.getFullYear();
function getDoc(k,init){if(!S.docs[k])S.docs[k]=init();return S.docs[k]}
const day=d=>getDoc(dayKey(d),()=>({tasks:[],energy:0,mood:0,win:"",lesson:"",blocked:""}));
const peekDay=d=>S.docs[dayKey(d)];
const week=d=>getDoc(weekKey(d),()=>({one:"",outcomes:[{t:"",done:false},{t:"",done:false},{t:"",done:false}],lesson:""}));
const month=d=>getDoc(monthKey(d),()=>({one:"",priorities:Array.from({length:5},()=>({t:"",done:false})),lesson:""}));
const year=d=>getDoc(yearKey(d),()=>({rocks:[{t:"",p:0},{t:"",p:0},{t:"",p:0}]}));
const settings=()=>getDoc("settings",()=>({tm:"",accent:"green"}));

/* ---------- storage: db (private per viewer) or this browser ---------- */
let db=null,userId=null;const LS="tm-planner-v1";
const writing={},dirty={},timers={};
function setSave(s,t){const el=$("#save");el.dataset.s=s;el.querySelector("span").textContent=t}
function lsAll(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function persist(k){
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),500);
  setSave("saving","Saving…");
}
function flushAll(){for(const k of Object.keys(timers)){if(timers[k]){clearTimeout(timers[k]);timers[k]=null;const body=JSON.parse(JSON.stringify(S.docs[k]||{}));delete body._sample;saveLocal(k,body);flush(k)}}}
addEventListener("pagehide",flushAll);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAll()});
async function flush(k){
  const body=JSON.parse(JSON.stringify(S.docs[k]||{}));delete body._sample;
  if(S.mode==="db"){
    if(writing[k]){dirty[k]=true;return}
    writing[k]=true;
    try{await db.collection("data/users/"+userId).doc(k).set(body);setSave("ok","Saved to your account")}
    catch(e){console.warn(e);S.mode="local";setSave("local","Saved in this browser");saveLocal(k,body)}
    writing[k]=false;if(dirty[k]){dirty[k]=false;flush(k)}
  }else{saveLocal(k,body)}
}
function saveLocal(k,body){try{const all=lsAll();all[k]=body;localStorage.setItem(LS,JSON.stringify(all));setSave("local","Saved in this browser")}catch(e){setSave("error","Not saved: browser storage is blocked")}}

async function boot(){
  try{S.sub="cal";S.itab=localStorage.getItem("tm-itab")||"done";}catch(e){}
  S.pm="review";
  applyLook();render();
  let loaded=null;
  try{
    const c=window.claude;
    if(c&&c.use){
      const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
      if(d&&u){userId=await u.id();if(userId){db=d;
        const snap=await db.collection("data/users/"+userId).limit(1000).get();
        loaded={};snap.docs.forEach(x=>{if(x.exists)loaded[x.id]=JSON.parse(JSON.stringify(x.data()))});
        S.mode="db";}}
    }
  }catch(e){console.warn("db unavailable",e);db=null;S.mode="local"}
  try{if(window.claude&&window.claude.use){window.claude.use("sample").then(f=>{if(f){sampleFn=f;S.coachOk=true;const c=$("#coachBox");if(c)c.hidden=false}}).catch(()=>{})}}catch(e){}
  if(!loaded)loaded=lsAll();
  const real=Object.keys(loaded).length>0;
  S.docs=loaded;
  if(!real){seedSample();S.sample=true}
  setSave(S.mode==="db"?"ok":"local",S.mode==="db"?"Saved to your account":"Saved in this browser");
  applySettings();render();applyBatches();
}

/* ---------- sample data (not saved) ---------- */
function seedSample(){
  let s=7;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  const pool=[["Client follow-up calls","do",60],["Update CRM notes","plan",30],["Prepare weekly report","plan",90],["1:1 with team lead","do",30],["Clear ticket queue","do",75],["Training module","plan",45],["Inbox to zero","delegate",20],["Review shift schedule","plan",25],["Team huddle","do",15],["Customer escalation","do",50],["Process refunds","delegate",40],["Knowledge base edits","plan",35]];
  const wins=["Closed 3 escalations","Report sent early","Great 1:1 feedback","Queue under 10","Finished training module",""];
  const t0=parse(TODAY);
  for(let i=-24;i<=1;i++){
    const d=addDays(t0,i);if(d.getDay()===0||(d.getDay()===6&&rnd()<.6))continue;
    const n=3+Math.floor(rnd()*3),tasks=[];
    for(let j=0;j<n;j++){const p=pool[Math.floor(rnd()*pool.length)];const past=i<0;

function paperPages(){if(S.billFor)return billPages(...S.billFor);const o=S.printOpt||{},v=S.view,pl=S.pm==="plan",keep=S.focus;let out="";

/* ================= PLAN MODE (future-looking) ================= */
const focusMin=()=>((S.docs.settings||{}).focusH||6)*60;

const yearDoc=Y=>getDoc("y"+Y,()=>({rocks:[{t:"",p:0},{t:"",p:0},{t:"",p:0}]}));
const peekYear=Y=>S.docs["y"+Y];
function keyDates(Y){const y=peekYear(Y);return (y&&y.keyDates)||[]}
function keyDatesOn(d){const ds=iso(d);return keyDates(d.getFullYear()).filter(k=>ds>=k.date&&ds<=(k.end||k.date))}

function recHits(r,d){const ds=iso(d);if(ds<(r.from||"0"))return false;const f=r.freq||"week";
  return f==="day"||(f==="week"&&r.dow===(d.getDay()+6)%7)||(f==="month"&&d.getDate()===(r.dom||+String(r.from||"").slice(8)))}
const RECL={day:"Every day",week:"Every week",month:"Every month"};

    .map(r=>{const t={id:`r:${r.id}:${ds}`,t:r.t,q:r.q||"plan",est:r.est||30,mins:0,status:"open",impact:0,one:false,rec:r.id,virtual:true,alarm:r.alarm||"off"};if(r.start)t.start=r.start;return t})}

  return recRules().filter(r=>r.kind==="ev"&&recHits(r,d)&&!skip.has(r.id)).map(r=>({...r.ev,id:`e:${r.id}:${ds}`,rec:r.id,virtual:true}))}
function evMat(ds,id){if(!id||!id.startsWith("e:"))return;const x=day(parse(ds));if((x.events||[]).some(e=>e.id===id))return;
  const r=recRules().find(q=>q.id===id.split(":")[1]);if(!r)return;x.evSkip=x.evSkip||[];if(!x.evSkip.includes(r.id))x.evSkip.push(r.id);
  (x.events=x.events||[]).push({...r.ev,id,rec:r.id});persist("d"+ds)}
function tasksOf(d){const x=peekDay(d);return [...(x?x.tasks:[]),...virtualRec(d)]}
function materialize(dk,id){if(!id.startsWith("r:"))return;const x=day(parse(dk));if(x.tasks.some(t=>t.id===id))return;
  const r=recRules().find(r=>r.id===id.split(":")[1]);if(!r)return;
  const t={id,t:r.t,q:r.q||"plan",est:r.est||30,mins:0,status:"open",impact:0,one:false,rec:r.id,alarm:r.alarm||"off"};if(r.start)t.start=r.start;x.tasks.push(t)}
function backlogOf(mk){const m=S.docs[mk];return m?(m.backlog||(m.backlog=[])):[]}

/* capacity */
function capacityMin(a,b){let n=0;for(let d=new Date(a);d<=b;d=addDays(d,1))if(isWorkday(d))n++;return n*focusMin()}

function capBar(plan,cap,label){const pct=cap?Math.min(100,plan/cap*100):plan?100:0,over=plan>cap;

/* ---- auto-schedule ---- */
function weekdayStrength(){const out=Array(7).fill(0),n=Array(7).fill(0),t0=parse(TODAY);
  for(let i=1;i<=56;i++){const d=addDays(t0,-i),s=dayStats(d);if(!s)continue;const k=(d.getDay()+6)%7;out[k]+=s.done;n[k]++}
  return out.map((v,i)=>n[i]?v/n[i]:0)}
function suggestSchedule(wi){
  const m=parse(wi),e=addDays(m,6),str=weekdayStrength();
  const days=Array.from({length:7},(_,i)=>addDays(m,i)).filter(d=>iso(d)>=TODAY&&isWorkday(d));
  if(!days.length){toast("No workdays left after today this week. Move tasks to next week on the Month plan.");return}
  const load={};days.forEach(d=>load[iso(d)]=tasksOf(d).filter(t=>t.q!=="drop"&&t.status!=="done").reduce((s,t)=>s+(+t.est||0),0));
  const pool=[...new Set([monthKey(m),monthKey(e)])].flatMap(k=>backlogOf(k).filter(t=>t.week===wi&&t.q!=="drop").map(t=>({t,src:k})));
  const qo={do:0,plan:1,delegate:2};
  pool.sort((a,b)=>(a.t.due||"9999")<(b.t.due||"9999")?-1:(a.t.due||"9999")>(b.t.due||"9999")?1:(qo[a.t.q]??1)-(qo[b.t.q]??1)||(+b.t.est||0)-(+a.t.est||0));
  let over=0;
  pool.forEach(({t,src})=>{const est=+t.est||30;
    let cands=days.filter(d=>!t.due||iso(d)<=t.due);if(!cands.length)cands=days;
    const fits=cands.filter(d=>load[iso(d)]+est<=focusMin());
    const pick=(fits.length?fits:cands).slice().sort((a,b)=>{
      const sa=(qo[t.q]===0?str[(a.getDay()+6)%7]:0)*20-load[iso(a)],sb=(qo[t.q]===0?str[(b.getDay()+6)%7]:0)*20-load[iso(b)];return sb-sa})[0];
    if(!fits.length)over++;
    const tk=takeTask(src,t.id);if(tk){putOnDay(tk,iso(pick));load[iso(pick)]+=est}});
  render();toast(`Scheduled ${pool.length} task${pool.length===1?"":"s"}${over?` · ${over} didn't fit, check red days`:""}`)}

document.addEventListener("click",e=>{

  if(a==="openweek"){S.focus=parse(v);S.view="week";window.scrollTo({top:0});return render()}
  if(a==="openmonth"){S.focus=new Date(S.focus.getFullYear(),+v,1);S.view="month";window.scrollTo({top:0});return render()}

  const Y=S.focus.getFullYear();
  if(a==="dump"){const ta=$("#dump");const lines=(ta.value||"").split(/\n+/).map(s=>s.replace(/^[-*•\d.)\s]+/,"").trim()).filter(Boolean);if(!lines.length)return;

    if(a==="msdel")r.milestones.splice(i,1);else r.milestones[i].done=!r.milestones[i].done;

  if(a==="quad"){if(src[0]==="d")materialize(src.slice(1),id);const t=findPlanTask(src,id);if(!t)return;t.q=QORD[(QORD.indexOf(t.q||"plan")+1)%4];persist(src);return render()}

  if(a==="shift"){const ds=src.slice(1),nd=iso(addDays(parse(ds),+v));if(nd<TODAY)return;const t=takeTask(src,id);if(t)putOnDay(t,nd);return render()}
});

const MODES={car:["🚗","Car","driving","car"],bike:["🚲","Bike","bicycling","bike"],foot:["🚶","Walk","walking","foot"],transit:["🚆","Transit","transit",null]};
const places=()=>((S.docs.settings||{}).places)||[];
const placeById=id=>places().find(p=>p.id===id);
const homeId=()=>(S.docs.settings||{}).homePlace||(places()[0]||{}).id||"";
function evFromAddr(ev,d){if(!ev.from||ev.from==="none")return null;
  if(ev.from==="prev"){const prev=dayEvents(d).filter(e=>e.loc&&toMin(e.end)<=toMin(ev.start)&&e.id!==ev.id).sort((a,b)=>toMin(b.end)-toMin(a.end))[0];return prev?prev.loc:(placeById(homeId())||{}).addr||null}
  const p=placeById(ev.from);return p?p.addr:null}
function fromLabel(ev){if(!ev.from||ev.from==="none")return "";if(ev.from==="prev")return "previous stop";const p=placeById(ev.from);return p?p.name:"";}
function mapsLink(from,to,mode){return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from||"")}&destination=${encodeURIComponent(to||"")}&travelmode=${(MODES[mode]||MODES.car)[2]}`}
const geoCache={};
async function geocode(addr){const k=addr.trim().toLowerCase();if(geoCache[k])return geoCache[k];
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addr)}`,{headers:{"Accept":"application/json"}});
  if(!r.ok)throw new Error("geocode "+r.status);const j=await r.json();if(!j.length)throw Object.assign(new Error("not found"),{code:"notfound",addr});
  return geoCache[k]=[+j[0].lon,+j[0].lat]}
async function estimateTravel(from,to,mode){const prof=(MODES[mode]||MODES.car)[3];if(!prof)throw Object.assign(new Error("transit"),{code:"transit"});
  const [a,b]=await Promise.all([geocode(from),geocode(to)]);
  const r=await fetch(`https://routing.openstreetmap.de/routed-${prof}/route/v1/driving/${a[0]},${a[1]};${b[0]},${b[1]}?overview=false`);
  if(!r.ok)throw new Error("route "+r.status);const j=await r.json();if(!j.routes||!j.routes.length)throw Object.assign(new Error("noroute"),{code:"noroute"});
  const min=Math.ceil(j.routes[0].duration/60);return mode==="car"?Math.ceil((min*1.1+5)/5)*5:Math.ceil(min/5)*5}
function travelItems(d){const out=[];dayEvents(d).forEach(e=>{const tr=+e.travel||0;if(!tr)return;const s=toMin(e.start),en=toMin(e.end);const ic=(MODES[e.mode]||MODES.car)[0];
  out.push({k:"tr",id:e.id+":to",t:`${ic} ${fmtH(tr)} to ${e.loc||e.t}`,s:s-tr,e:s,q:"tr",sub:`leave ${fmtT(s-tr)}${fromLabel(e)?" from "+fromLabel(e):""}`});
  if(e.rt)out.push({k:"tr",id:e.id+":back",t:`${ic} ${fmtH(tr)} back`,s:en,e:en+tr,q:"tr",sub:`home by ${fmtT(en+tr)}`})});return out}
function placeOptions(sel){const ps=places();return `${ps.map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${p.id===homeId()?"★ ":""}${esc(p.name)}</option>`).join("")}<option value="prev" ${sel==="prev"?"selected":""}>Previous stop</option><option value="none" ${sel==="none"?"selected":""}>No travel</option>`}
function placesBox(){const ps=places();return `<details class="places" ${ps.length?"":"open"}><summary>My places <span class="sub">${ps.length?ps.map(p=>esc(p.name)).join(" · "):"add Home or Work to estimate travel"}</span></summary>
  <ul class="rules">${ps.map(p=>`<li><button class="x" data-cal="home" data-id="${p.id}" title="Default starting place" aria-pressed="${p.id===homeId()}">${p.id===homeId()?"★":"☆"}</button><span class="rt"><b>${esc(p.name)}</b> <span class="sub">${esc(p.addr)}</span></span><span></span><button class="x" data-cal="delplace" data-id="${p.id}" title="Remove">✕</button></li>`).join("")}</ul>
  <form class="evform" data-cal-form="place"><input id="plN" autocomplete="off" placeholder="Name, e.g. Home" aria-label="Place name" style="flex:0 1 110px"><input id="plA" data-addr="place" autocomplete="off" placeholder="Street and city" aria-label="Where it is"><button class="ib">Save place</button></form></details>`}

/* ================= DAY CALENDAR (to-do + timeline) ================= */
const PPM=1;                                   // pixels per minute on screen (60px per hour)
const toMin=s=>{if(!s)return null;const[h,m]=String(s).split(":").map(Number);return h*60+(m||0)};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const snap=(m,st=15)=>Math.round(m/st)*st;
const calCfg=()=>{const s=S.docs.settings||{};return{d0:(s.dayStart??7)*60,d1:(s.dayEnd??20)*60,w0:toMin(s.workStart||"08:00"),w1:toMin(s.workEnd||"17:00")}};
const fmtT=m=>{const h=Math.floor(m/60),mm=m%60;return `${h}:${pad(mm)}`};
function dayEvents(d){const x=peekDay(d);return [...((x&&x.events)||[]),...virtualEv(d)]}
function scheduled(d,{includeDone=true}={}){return tasksOf(d).filter(t=>t.start&&(includeDone||t.status!=="done")&&t.status!=="carry"&&t.q!=="drop")}
function unscheduled(d){return tasksOf(d).filter(t=>isOpen(t)&&!t.start).sort((a,b)=>(b.one?1:0)-(a.one?1:0)||((a.due||"9")<(b.due||"9")?-1:(a.due||"9")>(b.due||"9")?1:0)||(QORD.indexOf(a.q||"plan")-QORD.indexOf(b.q||"plan")))}
function busyOf(d){const b=[];dayEvents(d).forEach(e=>{const s=toMin(e.start),en=toMin(e.end),tr=+e.travel||0;if(s!=null&&en>s)b.push([s-tr,en+(e.rt?tr:0)])});
  scheduled(d).forEach(t=>{const s=toMin(t.start);b.push([s,s+Math.max(15,+t.est||30)])});return b.sort((a,c)=>a[0]-c[0])}
function freeGaps(d){const {w0,w1}=calCfg();let from=w0;
  if(iso(d)===TODAY){const n=new Date(),nm=Math.ceil((n.getHours()*60+n.getMinutes())/15)*15;from=Math.max(from,nm)}
  if(!isWorkday(d)||from>=w1)return[];const gaps=[];let cur=from;
  for(const[s,e]of busyOf(d)){if(e<=cur)continue;if(s>cur)gaps.push([cur,Math.min(s,w1)]);cur=Math.max(cur,e);if(cur>=w1)break}
  if(cur<w1)gaps.push([cur,w1]);return gaps.filter(([a,b])=>b-a>=15)}
function nextSlot(d,dur){for(const[a,b]of freeGaps(d))if(b-a>=dur)return a;return null}
/* lay out overlapping blocks side by side */
function lanes(items){items.sort((a,b)=>a.s-b.s||b.e-a.e);let cluster=[],end=-1;const out=[];
  const flush=()=>{const lanesEnd=[];cluster.forEach(it=>{let l=lanesEnd.findIndex(x=>x<=it.s);if(l<0){l=lanesEnd.length;lanesEnd.push(0)}lanesEnd[l]=it.e;it.lane=l});cluster.forEach(it=>it.n=lanesEnd.length);out.push(...cluster);cluster=[]};
  items.forEach(it=>{if(it.s>=end&&cluster.length){flush();end=-1}cluster.push(it);end=Math.max(end,it.e)});if(cluster.length)flush();return out}
function timeline(d,{review=false,compact=false}={}){
  const {d0,d1}=calCfg(),ds=iso(d),H=(d1-d0)*PPM;
  const items=[...dayEvents(d).map(e=>({k:"ev",id:e.id,t:(e.client?"👤 "+(cSt(e)!=="completed"?CSTL[cSt(e)]+" · ":""):"")+e.t+(e.loc?` · 📍 ${e.loc}`:""),s:toMin(e.start),e:toMin(e.end),q:"mtg"})),...travelItems(d),
    ...scheduled(d).map(t=>({k:"task",id:t.id,t:t.t,s:toMin(t.start),e:toMin(t.start)+Math.max(15,+t.est||30),q:t.q||"plan",done:t.status==="done",one:t.one,rec:t.rec}))]
    .filter(it=>it.s!=null&&it.e>it.s);
  const laid=lanes(items),gaps=freeGaps(d);
  const hrs=[];for(let m=d0;m<d1;m+=60)hrs.push(`<div class="tl-h" style="top:${(m-d0)*PPM}px"><span>${fmtT(m)}</span></div>`);
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const blocks=laid.map(it=>{if(it.k==="tr"){const top=(Math.max(it.s,d0)-d0)*PPM,h=Math.max(16,(Math.min(it.e,d1)-Math.max(it.s,d0))*PPM),w=100/it.n;
      return `<div class="trv" style="top:${top}px;height:${h}px;left:calc(${it.lane*w}% + 2px);width:calc(${w}% - 4px)" title="${esc(it.t)} · ${esc(it.sub)}"><b>${esc(it.t)}</b>${h>=30?`<span>${esc(it.sub)}</span>`:""}</div>`}
    const top=(Math.max(it.s,d0)-d0)*PPM,h=Math.max(20,(Math.min(it.e,d1)-Math.max(it.s,d0))*PPM),w=100/it.n;
    return `<div class="blk q-${it.q} ${it.done?"done":""} ${it.k==="ev"?"ev":""} ${ds>TODAY&&!it.done&&it.k==="task"?"future":""}" data-k="${it.k}" data-id="${it.id}" data-ds="${ds}" data-s="${it.s}" data-e="${it.e}"
      style="top:${top}px;height:${h}px;left:calc(${it.lane*w}% + 2px);width:calc(${w}% - 4px)" title="${esc(it.t)} · ${fmtT(it.s)}–${fmtT(it.e)}">
      <div class="bt">${it.one?"★ ":""}${esc(it.t)}${it.rec?" ↻":""}</div>${h>=34?`<div class="bs">${fmtT(it.s)}–${fmtT(it.e)}${it.k==="ev"?" · event":""}</div>`:""}
      <div class="bx">${it.k==="task"&&review?`<button data-cal="done" title="${it.done?"Mark not done":"Mark done"}">${it.done?"↺":"✓"}</button>`:""}${it.k==="task"?`<button data-cal="unsched" title="Back to the to-do list">↩</button>`:`<button data-cal="delev" title="Delete event">✕</button>`}</div>
      <div class="rz" title="Drag to change length"></div></div>`}).join("");
  const gapEls=gaps.map(([a,b])=>`<button class="gap" data-cal="gap" data-ds="${ds}" data-s="${a}" data-e="${b}" style="top:${(a-d0)*PPM}px;height:${(b-a)*PPM}px"><span>Free ${fmtH(b-a)}${compact?"":" · click to fill"}</span></button>`).join("");
  const nowEl=ds===TODAY&&nm>=d0&&nm<=d1?`<div class="nowl" style="top:${(nm-d0)*PPM}px"><span>${fmtT(nm)}</span></div>`:"";
  return `<div class="tl ${compact?"compact":""}" data-ds="${ds}" style="height:${H}px">${hrs.join("")}<div class="tl-body" data-ds="${ds}">${gapEls}${blocks}${nowEl}</div></div>`}
function allDayRow(d){const kd=keyDatesOn(d);return kd.length?`<div class="allday"><span>All day</span>${kd.map(k=>`<span class="kd kd-${k.kind}">${k.kind==="off"?"🌴":k.kind==="deadline"?"⚑":"◆"} ${esc(k.t)}</span>`).join("")}</div>`:""}
function eventForm(d,o={}){const n=o.start??nextSlot(d,60)??calCfg().w0;const st=S.docs.settings||{};return `<form class="evform ev2" data-cal-form="event" data-ds="${iso(d)}" data-kind="${o.client?"client":"event"}">
   <input id="evT" placeholder="${o.client?"Patient's name (saved as First L.)":"Meeting or fixed event"}" aria-label="Name" style="flex:1 1 100%" autocomplete="off">
   <label class="evl cl-only"><span>Job#</span><input id="evJob" autocomplete="off" style="width:110px"></label><button type="button" class="ib cl-only syncb" data-sync title="Bring in your jobs from the interpreter schedule">⟳ Sync schedule</button>
   ${o.date?`<label class="evl"><span>Date</span><input id="evD" type="date" value="${iso(d)}"></label>`:""}<label class="evl"><span>Start</span><input id="evS" type="time" step="60" value="${fromMin(n)}"></label><label class="evl"><span>End</span><input id="evE" type="time" step="60" value="${fromMin(Math.min(n+60,24*60-15))}"></label>${alBtn("1h",'id="evAl" data-alpick data-v="1h"')}<span class="ev-only">${repBtn("evRep")}</span>
   <input id="evL" data-addr="event" autocomplete="off" placeholder="📍 Location or address (optional)" aria-label="Location" style="flex:1 1 100%">
   <label class="evl"><span>From</span><select id="evF">${placeOptions(o.client?(homeId()||"none"):"none")}</select></label>
   <label class="evl"><span>By</span><select id="evM">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${(st.lastMode||"car")===k?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></label>
   <label class="evl"><span>Travel</span><input id="evTr" class="num" inputmode="numeric" placeholder="min" style="width:64px"></label>
   <button type="button" class="ib" data-cal="estimate">Estimate</button>

function calTask(ds,id){materialize(ds,id);return day(parse(ds)).tasks.find(t=>t.id===id)}
function placeTask(ds,id,startMin){const t=calTask(ds,id);if(!t)return false;t.start=fromMin(startMin);persist("d"+ds);return true}
function autoFit(ds){const d=parse(ds);const list=unscheduled(d);let placed=0,miss=0;
  list.forEach(t=>{const dur=Math.max(15,+t.est||30),s=nextSlot(d,dur);if(s==null){miss++;return}if(placeTask(ds,t.id,s))placed++});
  render();toast(`Placed ${placed} to-do${placed===1?"":"s"}${miss?` · ${miss} didn't fit in your work hours`:""}`)}

document.addEventListener("click",e=>{const b=e.target.closest("[data-cal]");if(!b)return;const a=b.dataset.cal;

/* ---- miles: home → client 1 → client 2 → … → home ---- */
const LEGS={};
async function leg(a,b){const k=a+"|"+b;if(LEGS[k])return LEGS[k];const [p,q]=await Promise.all([geocode(a),geocode(b)]);
  const r=await fetch(`https://routing.openstreetmap.de/routed-car/route/v1/driving/${p[0]},${p[1]};${q[0]},${q[1]}?overview=false`);
  if(!r.ok)throw new Error("route");const j=await r.json();if(!j.routes||!j.routes.length)throw new Error("noroute");
  return LEGS[k]={mi:j.routes[0].distance/1609.344,min:j.routes[0].duration/60}}
const travels=e=>cSt(e)!=="missed"&&!(e.client&&e.client.nt);
const MILE_TABLE=[];
const normAddr=a=>String(a||"").toUpperCase().replace(/[.,#]/g," ").replace(/\s+/g," ").trim();
function oneWay(e){const a=normAddr(e.loc),t=(billCfg().raw.places||MILE_TABLE).find(r=>a.startsWith(r[0]));return t?t[1]:(e.client&&e.client.ow!=null?e.client.ow:null)}
function billMiles(e){const c=e.client||{};if(!travels(e))return 0;if(c.mi!=null&&c.mi!=="")return +c.mi||0;const ow=oneWay(e);if(ow==null)return 0;
  const trip=Math.round((e.rt===false?1:2)*ow*10)/10;return trip<billCfg().free?0:trip}
function dayClients(d){return dayEvents(d).filter(e=>e.client).sort((a,b)=>toMin(a.start)-toMin(b.start))}
async function estimateMonthMiles(y,m,quiet){const home=(places().find(p=>p.id===homeId())||{}).addr;if(!home){if(!quiet)toast("Save your Home place first (Event tab → My places)");return}
  let done=0,fail=0;const n=new Date(y,m+1,0).getDate();
  for(let i=1;i<=n;i++){const d=new Date(y,m,i),ds=iso(d);let changed=false;
    for(const e of dayClients(d).filter(e=>travels(e)&&e.loc)){const a=normAddr(e.loc);if((billCfg().raw.places||MILE_TABLE).some(r=>a.startsWith(r[0])))continue;
      const c=e.client;if(c.ow!=null&&c.owk===e.loc)continue;
      try{const l=await leg(home,e.loc);c.ow=Math.round(l.mi*10)/10;c.owk=e.loc;changed=true;done++}catch(_){fail++}}
    if(changed)persist("d"+ds)}
  if(quiet){render();return}
  render();toast(fail?`${fail} address${fail>1?"es":""} not in your mileage list. Type those miles in the list.`:done?`Miles found for ${done} new address${done===1?"":"es"}`:"All addresses have miles")}

/* ---- the numbers ---- */
function billRows(y,m){const b=billCfg(),rows=[],n=new Date(y,m+1,0).getDate();
  for(let i=1;i<=n;i++){const d=new Date(y,m,i);dayClients(d).forEach(e=>{const st=cSt(e),c=e.client,as=cAs(e),ae=cAe(e);
    const real=st==="completed"?Math.max(0,toMin(ae)-toMin(as)):st==="missed"?0:60,bill=st==="missed"?0:Math.max(60,real),mins=real;
    const svc=Math.round(b.rate*bill/60*100)/100,mi=billMiles(e),mc=Math.round(mi*b.mile*100)/100;
    rows.push({date:iso(d),job:c.job||"",name:e.t,st,as,ae,mins,flat:st==="noshow"||st==="resched"||(st==="completed"&&real<60),mi,svc,mc,tot:Math.round((svc+mc)*100)/100})})}
  return rows}
const money=v=>"$"+(+v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const bHM=m=>`${Math.floor(m/60)}:${pad(m%60)}`;
const t12=v=>{const m=toMin(v);if(m==null)return "";const h=Math.floor(m/60);return `${h%12||12}:${pad(m%60)} ${h<12?"AM":"PM"}`};
const usDate=ds=>{const d=parse(ds);return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()}`};
function billMeta(y,m){const b=billCfg(),key=`${y}-${pad(m+1)}`,now=new Date();if(!b.created[key]){b.created[key]=iso(now);persist("settings")}
  return {no:`CB-${y}${pad(m+1)}`,month:`${MONTH[m]} ${y}`,from:`${MON[m]} 1, ${y}`,to:`${MON[m]} ${new Date(y,m+1,0).getDate()}, ${y}`,created:usDate(b.created[key]),
    down:`${usDate(iso(now))} ${t12(fromMin(now.getHours()*60+now.getMinutes()))}`}}

/* parse the Cross Cultural Communications "Interpreter Job Requests" page text */
function ccParse(text){const out=[],T=String(text||"").replace(/\r/g,""),re=/(\d{2})\/(\d{2})\/(\d{2,4})\s+(\d{1,2}:\d{2}\s*[AP]M)\s+(\d{1,2}:\d{2}\s*[AP]M)\s+([A-Za-z]+)/g,hits=[];let m;
  while((m=re.exec(T)))hits.push({m,i:m.index,e:re.lastIndex});
  const to24=s=>{const k=s.trim().toUpperCase().match(/(\d{1,2}):(\d{2})\s*([AP])M/);if(!k)return "";let h=+k[1]%12;if(k[3]==="P")h+=12;return String(h).padStart(2,"0")+":"+k[2]};
  const tc=s=>s.toLowerCase().replace(/(^|[\s'-])([a-z])/g,(a,b,c)=>b+c.toUpperCase());
  const pname=s=>{s=s.replace(/,\s*$/,"").trim();let first,last;const c=s.indexOf(",");
